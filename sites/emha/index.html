<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emily Ha | Under Construction</title>
  <meta name="description" content="Emily Ha's website is under construction.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #292929;
      background: #f8f7f4;
    }
    main { width: min(100%, 620px); }
    .accent { width: 44px; height: 4px; margin-bottom: 32px; border-radius: 4px; background: #b48b5c; }
    .eyebrow { margin: 0 0 16px; font-size: .875rem; font-weight: 600; letter-spacing: .12em; color: #626262; }
    h1 { margin: 0 0 20px; font-size: clamp(2.25rem, 7vw, 4rem); font-weight: 600; line-height: 1.1; letter-spacing: -.04em; overflow-wrap: break-word; }
    .message { max-width: 42ch; margin: 0; color: #626262; font-size: 1.0625rem; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <div class="accent" aria-hidden="true"></div>
    <p class="eyebrow">EMILYHA.COM</p>
    <h1>Under construction.</h1>
    <p class="message">This website is taking shape. Please check back later.</p>
  </main>
</body>
</html>
